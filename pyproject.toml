[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-copilot"
version = "0.1.0"
description = "A research assistant built incrementally to learn LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "langgraph>=1.2",
    "langsmith>=0.12",
    "python-dotenv>=1.2",
    # Phase 2: retrieval
    "langchain-chroma>=1.1",
    "langchain-text-splitters>=1.1",
    "langchain-huggingface>=1.2",
    "sentence-transformers>=6.0",
    "pypdf>=6.0",
    # Phase 4: the SqliteSaver checkpointer. A separate package from langgraph
    # itself - langgraph ships MemorySaver, and each durable backend
    # (sqlite, postgres) is its own dependency you opt into.
    "langgraph-checkpoint-sqlite>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=9"]
# Phase 3: the local LangGraph dev server that LangGraph Studio connects to.
# Kept optional because it pulls in a web server and is only needed for
# visualization, not for the CLI or the tests.
studio = ["langgraph-cli[inmem]>=0.1.55"]
# Phase 7: a second provider, for the live-verification pass on a free tier.
# Optional: the Anthropic path never imports it.
groq = ["langchain-groq>=1.1"]

[project.scripts]
research-copilot = "research_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
